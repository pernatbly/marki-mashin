<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Марки машин</title>
</head>
<body>
    <div class="container">
        <h1>Выбери марку машины</h1>
        <div class="inner">
            <div class="item">
                <img src="botphoto/focus.png" alt="Ford" class="img">
                <button class="btn" id="btn_ford">Ford</button>
            </div>
            <div class="item">
                <img src="botphoto/duster.png" alt="Renault" class="img">
                <button class="btn" id="btn_renault">Renault</button>
            </div>
            <div class="item">
                <img src="botphoto/vesta.png" alt="Lada" class="img">
                <button class="btn" id="btn_lada">Lada</button>
            </div>
            <div class="item">
                <img src="botphoto/camry.png" alt="Toyota" class="img">
                <button class="btn" id="btn_toyota">Toyota</button>
            </div>
            <div class="item">
                <img src="botphoto/rio.png" alt="Kia" class="img">
                <button class="btn" id="btn_kia">Kia</button>
            </div>
            <div class="item">
                <img src="botphoto/creta.png" alt="Hyundai" class="img">
                <button class="btn" id="btn_hyundai">Hyundai</button>
            </div>
        </div>
    </div>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="app.js"></script>
</body>
</html>
