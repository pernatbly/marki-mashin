<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Марки машин</title>
</head>
<body>
    <div class="container">
        <!-- Экран 1: выбор марки -->
        <div id="screen-brands">
            <h1>Выбери марку</h1>
            <div class="grid" id="brands-grid"></div>
        </div>

        <!-- Экран 2: выбор модели -->
        <div id="screen-models" class="hidden">
            <button class="back-btn" id="back-to-brands">← Назад к маркам</button>
            <h1 id="models-title">Модели</h1>
            <div class="grid" id="models-grid"></div>
        </div>

        <!-- Экран 3: карточка модели -->
        <div id="screen-card" class="hidden">
            <button class="back-btn" id="back-to-models">← Назад к моделям</button>
            <img id="card-img" class="card-img" src="" alt="">
            <h2 id="card-title"></h2>
            <p id="card-desc"></p>
        </div>
    </div>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="app.js"></script>
</body>
</html>
